name: Contribution Snake

on:
  schedule:
    # 06:17 Asia/Shanghai (UTC+8), once per day.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate light and dark snake animations
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: SymphonyW
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%23116329
            dist/snake-dark.svg?palette=github-dark&color_snake=%2339d353

      - name: Publish to the snake branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: snake
          build_dir: dist
          jekyll: false
          allow_empty_commit: false
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
